name: dotnet workflow
on:
  push:
    branches:
      - develop

jobs: 
  myproject_dotnet:
    runs-on: 'ubuntu-latest'
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: project-build
        run: dotnet publish -c Release src/Presentation/Nop.Web/Nop.Web.csproj -o pragati
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3 # Use the latest stable version
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Your SonarCloud token secret
        with:
          args: >   # >   multiple values
            -Dsonar.organization=pragati029
            -Dsonar.projectKey=pragati029_nopCommerce
            -Dsonar.host.url=https://sonarcloud.io/       
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
